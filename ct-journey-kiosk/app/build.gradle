apply plugin: "com.android.application"

android {
    namespace "com.ctjourney.kiosk"
    compileSdk 34

    defaultConfig {
        applicationId "com.ctjourney.kiosk"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
