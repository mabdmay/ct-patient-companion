<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CT Patient Journey</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
 <div id="device-frame">
  <!-- Browsers refuse to play audio before the page has been touched, so Olaf would start
       the journey mute. One tap here both clears that and warms up the AudioContext; the
       line on screen is spoken as soon as it's dismissed. -->
  <div id="start-gate" style="display:none">
    <div class="start-inner">
      <h1>CT Journey</h1>
      <p>Tap anywhere to start</p>
    </div>
  </div>

  <div id="source-select" style="display:none">
    <h1>CT Journey</h1>
    <p>Before connecting, choose where Olaf's camera feed comes from.</p>
    <div id="source-buttons">
      <button id="source-none" class="source-btn">
        <span class="source-icon">&#9654;</span>
        <span class="source-label">No Camera</span>
        <span class="source-sub">Walk the journey with the on-screen buttons only</span>
      </button>
      <button id="source-external" class="source-btn">
        <span class="source-icon">&#128247;</span>
        <span class="source-label">External Camera</span>
        <span class="source-sub">USB camera plugged into the laptop</span>
      </button>
      <button id="source-robot" class="source-btn">
        <span class="source-icon">&#129302;</span>
        <span class="source-label">Robot Cameras</span>
        <span class="source-sub">The robot's own cameras, via the ACU Gateway</span>
      </button>
    </div>
    <p id="source-status"></p>
  </div>

  <div id="layout" style="display:none">
    <div id="content">
      <header>
        <div id="stage-title">Starting up...</div>
        <div class="progress-track"><div id="progress" class="progress-fill"></div></div>
      </header>

      <main>
        <div id="face" aria-hidden="true">
          <div class="eyes">
            <div class="eye eye-left"></div>
            <div class="eye eye-right"></div>
          </div>
          <div class="mouth"></div>
        </div>

        <p id="message">Please wait.</p>

        <div id="badges">
          <span id="track-badge" class="badge" style="display:none"></span>
          <span id="posture-badge" class="badge" style="display:none"></span>
        </div>

        <div id="examples"></div>

        <!-- One button per branch of the current phase, built from state.choices by app.js.
             Pressing one is the only thing that moves the journey on. -->
        <div id="controls"></div>
      </main>
    </div>

    <aside id="camera-panel" style="display:none">
      <figure>
        <div class="cam-wrap">
          <img id="live-cam" alt="camera" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'">
          <div id="face-frame"></div>
        </div>
        <figcaption id="cam-caption">Looking for you...</figcaption>
      </figure>
    </aside>
  </div>
 </div>

  <script src="/app.js"></script>
</body>
</html>
